<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Triaje AIoT · Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <!-- Non-blocking font load: print trick loads the sheet async, then swaps to all -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body style="margin:0;background:#0a0f17">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
